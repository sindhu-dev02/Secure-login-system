{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<h1>Sign in</h1>
<form class="stack" method="post">
  {{ csrf_input() }}
  <label>Username
    <input name="username" value="{{ form.get('username', '') }}" autocomplete="username" autofocus required>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Continue</button>
</form>
<p class="alt">
  No account yet? <a href="{{ url_for('register') }}">Register</a><br>
  <a href="{{ url_for('reset_request') }}">Forgot your password?</a>
</p>
{% endblock %}
