{% extends "base.html" %}
{% block title %}Enter code{% endblock %}
{% block body %}
<h1>Enter your code</h1>
<p class="lede">We texted a code to <span class="mono">{{ phone }}</span>.</p>
<form class="stack" method="post">
  {{ csrf_input() }}
  <label>Code
    <input class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]{4,10}" maxlength="10" autofocus required>
  </label>
  <button type="submit">Verify</button>
</form>
<form class="alt" method="post" action="{{ url_for('resend') }}">
  {{ csrf_input() }}
  Nothing arrived? <button class="link" type="submit">Send a new code</button>
</form>
{% endblock %}
