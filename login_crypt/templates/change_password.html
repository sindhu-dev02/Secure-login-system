{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<h1>Change password</h1>
<form class="stack" method="post">
  {{ csrf_input() }}
  <label>Current password
    <input name="current" type="password" autocomplete="current-password" autofocus required>
  </label>
  <label>New password
    <input name="new" type="password" autocomplete="new-password" minlength="10" required>
  </label>
  <label>New password again
    <input name="again" type="password" autocomplete="new-password" minlength="10" required>
  </label>
  <p class="hint">Changing it signs you out on every other device.</p>
  <button type="submit">Change password</button>
</form>
<p class="alt"><a href="{{ url_for('dashboard') }}">Cancel</a></p>
{% endblock %}
